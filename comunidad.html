<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comunidad - Muebles Kolosos</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<header class="header">
    <div class="logo">
        <img src="imagenes/logo.png" alt="Logo Muebles Kolosos">
        <span>Muebles Kolosos</span>
    </div>
    <nav class="menu">
        <a href="carrito.html" class="carrito-link" aria-label="Ver carrito">
            <div class="carrito">
                <img src="imagenes/carrito.avif" alt="Carrito">
                <span id="contador-carrito" class="contador-badge">0</span>
            </div>
        </a>
        <a href="index.html">Inicio</a>
        <a href="catalogo.html">Catálogo</a>
        <a href="promociones.html">Promociones</a>
        <a href="escaparate.html">Campaña</a>
        <a href="comunidad.html">Comunidad</a>
        <a href="c2c.html">Publicar C2C</a>
        <a href="subasta.html">Subasta</a>
        <a href="nosotros.html">Nosotros</a>
        <a href="contacto.html">Contacto</a>
        <a href="perfil.html">Mi Perfil</a>
    </nav>
</header>

<main class="contenedor-seccion" style="max-width:800px;">
    <h1 class="titulo-pagina">Comunidad y Opiniones</h1>
    
    <form id="form-comunidad" style="background:#6f472e; padding:25px; border-radius:12px; display:flex; flex-direction:column; gap:15px; margin-bottom: 30px;">
        <h3 style="color: white; margin: 0;">Deja tu reseña o comentario</h3>
        <input type="text" id="autor" placeholder="Tu nombre" style="padding:10px; border-radius:6px; border:1px solid #ccc;">
        <textarea id="texto" placeholder="Opinión..." style="padding:10px; border-radius:6px; border:1px solid #ccc; height: 90px;"></textarea>
        <button type="submit" class="boton">Publicar</button>
    </form>

    <h3 style="margin-bottom: 15px; color: white;">Opiniones Recientes (10 Comentarios)</h3>
    <div id="lista" style="display:flex; flex-direction:column; gap:12px;"></div>
</main>

<script src="global.js"></script>
<script>
document.addEventListener("DOMContentLoaded", () => {
    const form = document.getElementById("form-comunidad");
    const lista = document.getElementById("lista");

    // Definimos siempre los 10 comentarios base para que aparezcan completos
    const comentariosIniciales = [
        { autor: "María Antonieta", texto: "Excelentes muebles, de muy buena calidad.", fecha: "Justo ahora" },
        { autor: "Sofía Ramírez", texto: "¡Me encantó la atención y el diseño de la cama King Size Turín!", fecha: "Hace 2 días" },
        { autor: "Carlos Mendoza", texto: "La mesa comedor Nordik llegó en perfecto estado y el armado fue muy sencillo.", fecha: "Hace 3 días" },
        { autor: "Fernando Torres", texto: "Participé en la subasta y gané un descuento increíble. Muy recomendado.", fecha: "Hace 4 días" },
        { autor: "Lucía Méndez", texto: "El sofá seccional L-Shape superó todas mis expectativas. Comodidad absoluta.", fecha: "Hace 5 días" },
        { autor: "Alejandro Ruiz", texto: "Excelente servicio al cliente y entrega rápida hasta la puerta de mi casa.", fecha: "Hace 6 días" },
        { autor: "Valeria Paz", texto: "Los cupones de descuento funcionan de maravilla en el carrito. ¡Gracias Kolosos!", fecha: "Hace 1 semana" },
        { autor: "Héctor Garza", texto: "Me encanta la sección C2C, pude vender un escritorio viejo muy fácil.", fecha: "Hace 1 semana" },
        { autor: "Mariana Soto", texto: "La calidad de la madera se nota desde el primer instante. 10/10.", fecha: "Hace 2 semanas" },
        { autor: "Diego Luna", texto: "Diseños muy modernos y elegantes para departamentos pequeños.", fecha: "Hace 2 semanas" }
    ];

    function render() {
        // Obtenemos los guardados y combinamos o usamos la lista fija para garantizar los 10 elementos
        let guardados = JSON.parse(localStorage.getItem("comentarios_kolosos")) || [];
        // Si hay menos de 10 elementos guardados, nos aseguramos de mostrar los 10 completos
        let coms = guardados.length >= 10 ? guardados : [...guardados, ...comentariosIniciales].slice(0, 15);
        
        lista.innerHTML = coms.map(c => `
            <div style="background:white; padding:15px; border-radius:8px; color:#333; box-shadow: 0 2px 8px rgba(0,0,0,0.06);">
                <div style="display:flex; justify-content:space-between; margin-bottom:5px;">
                    <strong>${c.autor}</strong>
                    <span style="color:#64748b; font-size:0.85rem;">${c.fecha}</span>
                </div>
                <p style="margin:0; color:#475569;">${c.texto}</p>
            </div>
        `).join("");
    }

    form.addEventListener("submit", (e) => {
        e.preventDefault();
        let guardados = JSON.parse(localStorage.getItem("comentarios_kolosos")) || comentariosIniciales;
        guardados.unshift({
            autor: document.getElementById("autor").value || "Anónimo",
            texto: document.getElementById("texto").value || "Sin comentario",
            fecha: "Hoy"
        });
        localStorage.setItem("comentarios_kolosos", JSON.stringify(guardados));
        render(); 
        form.reset(); 
        mostrarMensajeVisual("Publicado con éxito", "exito");
    });

    render();
});
</script>
</body>
</html>
