<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo - Muebles Kolosos</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="header">
        <div class="logo">
            <img src="imagenes/logo.png" alt="Logo Muebles Kolosos" onerror="this.src='https://via.placeholder.com/50'">
            <span>Muebles Kolosos</span>
        </div>
        <nav class="menu">
            <div class="carrito">
                <a href="carrito.html" style="position:relative; display:inline-block;">
                    <img src="imagenes/carrito.avif" alt="Carrito" onerror="this.src='https://via.placeholder.com/24'">
                    <span id="contador-carrito" style="position:absolute; top:-8px; right:-8px; background:#e74c3c; color:white; border-radius:50%; padding:2px 6px; font-size:12px; font-weight:bold;">0</span>
                </a>
            </div>
            <a href="index.html">Inicio</a>
            <a href="catalogo.html" class="activo">Catálogo</a>
            <a href="nosotros.html">Nosotros</a>
            <a href="contacto.html">Contacto</a>
            <a href="perfil.html">Mi Perfil</a>
        </nav>
    </header>

    <main class="contenedor-seccion" style="padding: 20px;">
        <h2 style="text-align: center; margin-bottom: 20px;">NUESTRO CATÁLOGO DE MUEBLES</h2>

        <!-- BARRA DE BÚSQUEDA Y FILTROS DE CATEGORÍA -->
        <div style="display: flex; flex-wrap: wrap; gap: 15px; justify-content: center; margin-bottom: 30px;">
            <input type="text" id="input-buscar" placeholder="🔍 Buscar muebles..." style="padding: 10px; width: 280px; border: 1px solid #ccc; border-radius: 5px;">
            <select id="select-categoria" style="padding: 10px; border: 1px solid #ccc; border-radius: 5px;">
                <option value="todos">Todas las categorías</option>
                <option value="sofas">Sofás</option>
                <option value="mesas">Mesas</option>
                <option value="camas">Camas / Dormitorio</option>
            </select>
        </div>

        <!-- NOTIFICACIÓN DE ESTADO -->
        <div id="notificacion-toast" class="alerta-exito oculto" style="text-align: center; margin-bottom: 15px;"></div>

        <!-- REJILLA DE PRODUCTOS -->
        <div id="contenedor-productos" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 20px;"></div>
    </main>

    <footer class="footer-kolosos" style="margin-top: 40px;">
        <div class="footer-inferior" style="text-align: center; padding: 15px;">
            <p>© 2026 Muebles Kolosos. Todos los Derechos Reservados.</p>
        </div>
    </footer>

    <script src="productos.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const contenedor = document.getElementById("contenedor-productos");
            const inputBuscar = document.getElementById("input-buscar");
            const selectCategoria = document.getElementById("select-categoria");
            const toast = document.getElementById("notificacion-toast");

            function actualizarContador() {
                const carrito = JSON.parse(localStorage.getItem("carrito_kolosos")) || [];
                const totalCant = carrito.reduce((acc, item) => acc + item.cantidad, 0);
                document.getElementById("contador-carrito").textContent = totalCant;
            }

            function renderizarProductos(lista) {
                contenedor.innerHTML = "";
                if (lista.length === 0) {
                    contenedor.innerHTML = "<p style='grid-column: 1/-1; text-align:center;'>No se encontraron muebles en esta búsqueda.</p>";
                    return;
                }

                lista.forEach(prod => {
                    // Estado visual del badge de acuerdo con el stock / precio
                    const badge = prod.stock === 0 ? '<span style="background:#e74c3c; color:white; padding:3px 8px; border-radius:3px; font-size:11px; font-weight:bold;">Agotado</span>' :
                                  prod.precioNum < 300000 ? '<span style="background:#27ae60; color:white; padding:3px 8px; border-radius:3px; font-size:11px; font-weight:bold;">¡Oferta!</span>' :
                                  '<span style="background:#2980b9; color:white; padding:3px 8px; border-radius:3px; font-size:11px; font-weight:bold;">Nuevo</span>';

                    const card = document.createElement("div");
                    card.className = "tarjeta-producto";
                    card.style = "border: 1px solid #e0e0e0; border-radius: 8px; padding: 12px; background: white; display: flex; flex-direction: column; justify-content: space-between; box-shadow: 0 2px 5px rgba(0,0,0,0.05);";
                    
                    card.innerHTML = `
                        <div>
                            <!-- ENCABEZADO DE LA TARJETA: BADGE Y STOCK -->
                            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
                                ${badge}
                                <small style="color:#666; font-size:12px;">Stock: ${prod.stock}</small>
                            </div>

                            <!-- IMAGEN DEL MUEBLE -->
                            <img src="${prod.imagen}" alt="${prod.nombre}" style="width:100%; height:160px; object-fit:cover; border-radius:6px; margin-bottom:10px;" onerror="this.src='https://via.placeholder.com/200x160?text=Mueble'">

                            <!-- NOMBRE DEL MUEBLE -->
                            <h3 style="font-size:15px; color:#333; margin: 0 0 8px 0; font-weight:600; min-height:38px; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;">${prod.nombre}</h3>

                            <!-- PRECIO -->
                            <p style="font-weight:bold; color:#d35400; font-size:18px; margin: 0 0 12px 0;">${prod.precio}</p>
                        </div>

                        <!-- BOTONES DE ACCIÓN (Ver Detalle y Agregar) -->
                        <div style="display:flex; gap:8px;">
                            <a href="detalle.html?id=${prod.id}" class="boton" style="flex:1; text-align:center; text-decoration:none; background:#7f8c8d; color:white; font-size:12px; padding:8px 0; border-radius:4px; font-weight:bold;">Ver Detalle</a>
                            <button onclick="agregarAlCarrito('${prod.id}')" class="boton" style="flex:1; background:#b05b3b; color:white; font-size:12px; padding:8px 0; border:none; border-radius:4px; font-weight:bold; cursor:pointer;" ${prod.stock === 0 ? 'disabled style="opacity:0.5; cursor:not-allowed;"' : ''}>Agregar</button>
                        </div>
                    `;
                    contenedor.appendChild(card);
                });
            }

            window.agregarAlCarrito = function(idProd) {
                const productos = obtenerProductos();
                const prod = productos.find(p => p.id === idProd);
                if (!prod) return;

                let carrito = JSON.parse(localStorage.getItem("carrito_kolosos")) || [];
                const itemExistente = carrito.find(item => item.id === idProd);

                if (itemExistente) {
                    itemExistente.cantidad += 1;
                } else {
                    carrito.push({ ...prod, cantidad: 1 });
                }

                localStorage.setItem("carrito_kolosos", JSON.stringify(carrito));
                actualizarContador();

                toast.textContent = "✅ Producto agregado con éxito";
                toast.classList.remove("oculto");
                setTimeout(() => toast.classList.add("oculto"), 2500);
            };

            function filtrar() {
                const texto = inputBuscar.value.toLowerCase();
                const cat = selectCategoria.value;
                const productos = obtenerProductos();

                const filtrados = productos.filter(p => {
                    const coincideNombre = p.nombre.toLowerCase().includes(texto);
                    const coincideCat = cat === "todos" || p.categoria === cat;
                    return coincideNombre && coincideCat;
                });

                renderizarProductos(filtrados);
            }

            inputBuscar.addEventListener("input", filtrar);
            selectCategoria.addEventListener("change", filtrar);

            renderizarProductos(obtenerProductos());
            actualizarContador();
        });
    </script>
</body>
</html>
