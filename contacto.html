<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto - Muebles Kolosos</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

        <!-- BARRA SUPERIOR (HEADER) -->
  <header class="header">
    <div class="logo">
        <img src="imagenes/logo.png" alt="Logo Muebles Kolosos">
        <span>Muebles Kolosos</span>
    </div>
    <nav class="menu">
        <a href="carrito.html" class="carrito-link" aria-label="Ver carrito">
            <div class="carrito">
                <img src="imagenes/carrito.avif" alt="Carrito">
                <span id="contador-carrito" class="contador-badge">0</span>
            </div>
        </a>
        <a href="index.html">Inicio</a>
        <a href="catalogo.html">Catálogo</a>
        <a href="nosotros.html">Nosotros</a>
        <a href="contacto.html">Contacto</a>
        <a href="perfil.html">Mi Perfil</a>
    </nav>
</header>

    <!-- SECCIÓN FORMULARIO DE CONTACTO -->
    <main class="contenedor-seccion">
        <h1 class="titulo-pagina">Contáctanos</h1>
        <p class="subtitulo-pagina">¿Tienes alguna duda o solicitud especial? Escríbenos y te responderemos pronto.</p>

        <!-- ALERTA SIMULADA -->
        <div id="alerta-contacto" class="alerta-exito oculto">
            Mensaje enviado. ¡Nos pondremos en contacto contigo pronto!
        </div>

        <!-- FORMULARIO DE CONTACTO -->
        <form id="form-contacto" class="formulario-contacto">
            <div class="campo-form">
                <label for="nombre">Nombre completo</label>
                <input type="text" id="nombre" placeholder="Tu nombre" >
            </div>

            <div class="campo-form">
                <label for="email-contacto">Correo electrónico</label>
                <input type="email" id="email-contacto" placeholder="tu@correo.com">
            </div>

            <div class="campo-form">
                <label for="mensaje">Mensaje</label>
                <textarea id="mensaje" rows="5" placeholder="Escribe tu mensaje aquí..."></textarea>
            </div>

            <button type="submit" class="boton">Enviar Mensaje</button>
        </form>

        <!-- REDES SOCIALES -->
        <div class="redes-sociales">
            <h3>Síguenos en nuestras redes</h3>
            <div class="iconos-redes">
                <a href="#facebook" class="link-red">Facebook</a>
                <a href="#instagram" class="link-red">Instagram</a>
                <a href="#pinterest" class="link-red">Pinterest</a>
            </div>
        </div>
    </main>

    <!-- SCRIPT SIMULACIÓN CONTACTO -->
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const formContacto = document.getElementById("form-contacto");
            const alertaContacto = document.getElementById("alerta-contacto");

            formContacto.addEventListener("submit", (e) => {
                e.preventDefault(); // Detiene la recarga de la página

                // Muestra la alerta
                alertaContacto.classList.remove("oculto");

                // Limpia el formulario
                formContacto.reset();

                // Oculta la alerta tras 4 segundos
                setTimeout(() => {
                    alertaContacto.classList.add("oculto");
                }, 4000);
            });
        });
    </script>
<script src="global.js"></script>
</body>

</html>
