<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Muebles Kolosos</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- BARRA SUPERIOR -->
    <header class="header">

        <!-- LOGO Y NOMBRE -->
        <div class="logo">
            <img src="imagenes/logo.png" alt="Logo Muebles Kolosos">
            <span>Muebles Kolosos</span>
        </div>

        <!-- MENÚ -->
        <nav class="menu">
            <div class="carrito">
            <button ><img src="imagenes/carrito.avif" ></button>
            </div>
            <a href="index.html">Inicio</a>
            <a href="catalogo.html">Catálogo</a>
            <a href="nosotros.html">Nosotros</a>
            <a href="contacto.html">Contacto</a>
            <a href="login.html">Iniciar sesión</a>
        </nav>

    </header>


    <!-- CONTENIDO PRINCIPAL -->
   <main>
        <section class="inicio">

            <!-- TÍTULO ALINEADO A LA IZQUIERDA -->
            <div class="header-texto">
                <h1>Haz de tu espacio algo extraordinario</h1>
            </div>

            <!-- CONTENEDOR DEL VIDEO CON TEXTO ENCIMA (OVERLAY) -->
            <div class="video-contenedor">
                <video autoplay loop muted playsinline>
                    <source src="imagenes/muebles.mp4" type="video/mp4">
                    Tu navegador no soporta la reproducción de video.
                </video>

                <!-- TEXTO Y BOTÓN LITERALMENTE ENCIMA DEL VIDEO -->
                <div class="contenido-encima">
                    <p>
                        Encuentra muebles que combinan diseño, comodidad y calidad para
                        transformar cada espacio de tu hogar.
                    </p>
                    <a href="catalogo.html" class="boton">
                        Ver catálogo
                    </a>
                </div>
            </div>

        </section>
    </main>

</body>

</html>
