<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="pagina-titulo">Muebles Kolosos - Detalle de Producto</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="header">
        <div class="logo">
            <img src="imagenes/logo.png" alt="Logo Muebles Kolosos">
            <span>Muebles Kolosos</span>
        </div>
        <nav class="menu">
            <div class="carrito">
                <button><img src="imagenes/carrito.avif" alt="Carrito"></button>
            </div>
            <a href="index.html">Inicio</a>
            <a href="catalogo.html">Catálogo</a>
            <a href="nosotros.html">Nosotros</a>
            <a href="contacto.html">Contacto</a>
            <a href="Perfil.html">Perfil</a>
        </nav>
    </header>

    <main class="contenedor-seccion">
        <a href="catalogo.html" class="boton-volver">← Volver al catálogo</a>

        <div class="detalle-producto-container" id="detalle-contenedor">
            <div class="imagen-detalle">
                <img id="prod-imagen" src="" alt="Cargando...">
            </div>

            <div class="info-detalle">
                <h1 id="prod-nombre">Cargando producto...</h1>
                <span id="prod-precio" class="precio-detalle"></span>
                <p id="prod-descripcion" class="descripcion-corta"></p>
                <div class="acciones-detalle">
                    <button id="btn-agregar" class="boton">Añadir al carrito</button>
                </div>
            </div>
        </div>
    </main>

    <script>
        const productos = {
            "sofa-odesa": {
                nombre: "Sofá Comfort Odesa",
                precio: "$450.000",
                imagen: "imagenes/sofa.png",
                descripcion: "Sofá de tres puestos tapizado en tela gris claro de textura suave, con patas de madera clara de diseño nórdico y cojines decorativos incluidos."
            },
            "sofa-lshape": {
                nombre: "Sofá Seccional L-Shape",
                precio: "$680.000",
                imagen: "imagenes/sofa2.jpg",
                descripcion: "Sofá esquinero en L tapizado en pana acanalada color negro, con chaise longue amplio y estructura de perfil bajo ideal para salas de estar modernas."
            },
            "sillon-leather": {
                nombre: "Sillón Reclinable Leather",
                precio: "$310.000",
                imagen: "imagenes/sofa3.jpeg",
                descripcion: "Sillón individual reclinable en piel sintética color café marrón, con apoyabrazos mullidos, reposapiés extensible y respaldo anatómico."
            },
            "sofa-cama": {
                nombre: "Sofá Cama Minimalista",
                precio: "$390.000",
                imagen: "imagenes/sofa-cama.jpg",
                descripcion: "Sofá convertible en cama tapizado en tela gris oscuro con reposabrazos acolchados y patas inclinadas de estilo contemporáneo."
            },
            "loveseat-vintage": {
                nombre: "Loveseat Vintage",
                precio: "$280.000",
                imagen: "imagenes/loveseat.jpg",
                descripcion: "Sofá clásico de dos puestos con tapizado capitoné en cuero/sintético color plata, marco tallado de estilo barroco y cojines cilíndricos a juego."
            },
            "mesa-nordik": {
                nombre: "Mesa Comedor Nordik",
                precio: "$320.000",
                imagen: "imagenes/mesa-nordik.jpg",
                descripcion: "Mesa de comedor rectangular en madera maciza de tono natural con patas en cruz tipo 'X', acompañada por sillas tapizadas en gris oscuro."
            },
            "mesa-centro-cristal": {
                nombre: "Mesa de Centro Cristal",
                precio: "$180.000",
                imagen: "imagenes/mesa-cristal.jpg",
                descripcion: "Mesa de centro con cubierta superior de vidrio transparente, repisa inferior de almacenamiento y estructura de madera en tono oscuro."
            },
            "comedor-6-puestos": {
                nombre: "Juego Comedor 6 Puestos",
                precio: "$750.000",
                imagen: "imagenes/comedor-6.jpg",
                descripcion: "Juego de comedor para exterior o interior con mesa de listones de madera clara y 6 sillones ergonómicos en ratán sintético tejido tono negro."
            },
            "mesa-lateral-madera": {
                nombre: "Mesa Lateral Rustik",
                precio: "$120.000",
                imagen: "imagenes/mesa-lateral.jpg",
                descripcion: "Mesa auxiliar o de noche fabricada en madera envejecida tono gris/rústico, con dos niveles organizadores y estructura rectangular sólida."
            },
            "escritorio-ejecutivo": {
                nombre: "Escritorio Ejecutivo Moderno",
                precio: "$290.000",
                imagen: "imagenes/escritorio.jpg",
                descripcion: "Escritorio ejecutivo con acabado en melamina simil madera oscura, tapete central protector y credenza lateral integrada con compartimentos."
            },
            "cama-king-turin": {
                nombre: "Cama King Size Turín",
                precio: "$620.000",
                imagen: "imagenes/cama-king.jpg",
                descripcion: "Juego de cama King Size de líneas limpias con estructura de madera natural, cabecero blanco minimalista y ropa de cama incluida."
            },
            "cama-queen-venecia": {
                nombre: "Cama Queen Size Venecia",
                precio: "$510.000",
                imagen: "imagenes/cama-queen.jpg",
                descripcion: "Cama Queen Size con un elegante cabecero alto tapizado en tela azul marino con diseño de costuras verticales acolchadas."
            },
            "velador-minimalista": {
                nombre: "Mesa de Noche Minimalista",
                precio: "$95.000",
                imagen: "imagenes/velador.jpg",
                descripcion: "Mesa de noche cúbica de acabado acrílico/cristal ahumado negro, con diseño limpio sin tiradores e iluminación reflejada."
            },
            "ropero-3-puertas": {
                nombre: "Clóset Ropero 3 Puertas",
                precio: "$480.000",
                imagen: "imagenes/ropero.jpg",
                descripcion: "Ropero moderno en tono negro mate con 3 puertas abatibles, manijas metálicas plateadas, cerradura de seguridad y espejo en el lateral."
            },
            "poltrona-dormitorio": {
                nombre: "Poltrona de Lectura Accent",
                precio: "$240.000",
                imagen: "imagenes/poltrona.jpg",
                descripcion: "Poltrona individual con respaldo alto en tejido capitoné gris oscuro, apoyabrazos rectos y patas cónicas de madera inclinadas."
            }
        };

        document.addEventListener("DOMContentLoaded", () => {
            const parametros = new URLSearchParams(window.location.search);
            const productoId = parametros.get("id");

            const titulo = document.getElementById("prod-nombre");
            const precio = document.getElementById("prod-precio");
            const imagen = document.getElementById("prod-imagen");
            const descripcion = document.getElementById("prod-descripcion");
            const btnAgregar = document.getElementById("btn-agregar");

            if (productoId && productos[productoId]) {
                const prod = productos[productoId];

                document.title = `${prod.nombre} - Muebles Kolosos`;
                titulo.textContent = prod.nombre;
                precio.textContent = prod.precio;
                imagen.src = prod.imagen;
                imagen.alt = prod.nombre;
                descripcion.textContent = prod.descripcion;
            } else {
                titulo.textContent = "Producto no encontrado";
                descripcion.textContent = "El producto solicitado no está disponible o la ruta es incorrecta.";
                if (precio) precio.style.display = "none";
                if (imagen) imagen.style.display = "none";
                if (btnAgregar) btnAgregar.style.display = "none";
            }
        });
    </script>
</body>
</html>
