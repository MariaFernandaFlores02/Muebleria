<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Detalle de Producto - Muebles Kolosos</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<!-- BARRA SUPERIOR (HEADER) -->
<header class="header">
<div class="logo">
<img src="imagenes/logo.png" alt="Logo Muebles Kolosos">
<span>Muebles Kolosos</span>
</div>
<nav class="menu">
<a href="carrito.html" class="carrito-link" aria-label="Ver carrito">
<div class="carrito">
<img src="imagenes/carrito.avif" alt="Carrito">
<span id="contador-carrito" class="contador-badge">0</span>
</div>
</a>
<a href="index.html">Inicio</a>
<a href="catalogo.html">Catálogo</a>
<a href="nosotros.html">Nosotros</a>
<a href="contacto.html">Contacto</a>
<a href="perfil.html">Mi Perfil</a>
</nav>
</header>
<main class="contenedor-seccion" style="padding:20px; max-width:900px; margin:auto;">
<a href="catalogo.html" style="text-decoration:none; color:#2980b9; font-weight:bold;"> Volver al catálogo</a>
<div id="notificacion-toast" class="alerta-exito oculto" style="text-align:center; margin-top:15px;"></div>
<!-- CONTENEDOR DETALLE -->
<div id="detalle-contenedor" style="display:flex; flex-wrap:wrap; gap:30px; margin-top:20px; background:white; padding:20px; border-radius:8px;"></div>
<!-- PRODUCTOS PARECIDOS/SUGERENCIAS -->
<div style="margin-top:40px;">
<h3>Sugerencias: Productos parecidos que te podrían gustar</h3>
<div id="contenedor-relacionados" style="display:grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap:15px; margin-top:15px;"></div>
</div>
</main>
<script src="productos.js"></script>
<script>
document.addEventListener("DOMContentLoaded", () => {
const params = new URLSearchParams(window.location.search);
const idProducto = params.get("id");
const productos = obtenerProductos();
const producto = productos.find(p => p.id === idProducto) || productos[0];
const contenedor = document.getElementById("detalle-contenedor");
const contenedorRel = document.getElementById("contenedor-relacionados");
const toast = document.getElementById("notificacion-toast");

// RENDER DETALLE DEL PRODUCTO
contenedor.innerHTML = `
<div style="flex: 1; min-width:280px;">
<img src="${producto.imagen}" alt="${producto.nombre}" style="width: 100%; border-radius:8px; object-fit:cover; max-height:350px;" onerror="this.src='https://via.placeholder.com/300'">
</div>
<div style="flex: 1; min-width: 280px; display:flex; flex-direction:column; justify-content:center;">
<h2>${producto.nombre}</h2>
<p style="font-size:24px; color:#d35400; font-weight:bold; margin: 10px 0;">${producto.precio}</p>
<p style="color:#555; margin-bottom: 15px;">Elegante mueble diseñado con materiales de alta calidad para darle a tu hogar la comodidad y distinción que merece.</p>
<p><strong>Stock disponible:</strong> ${producto.stock} unidades</p>

<!-- SECCIÓN DE PROMOCIONES POR CATEGORÍA (NUEVA) -->
<div id="box-promociones-categoria" style="margin: 15px 0; padding: 12px; background: #f8fafc; border: 1px dashed #cbd5e1; border-radius: 6px;">
<h4 style="margin: 0 0 8px 0; color: #1e293b; font-size: 0.95rem;">Promociones aplicables a esta categoría:</h4>
<div id="lista-promos-aplicables"></div>
</div>

<div style="display:flex; align-items:center; gap: 10px; margin:20px 0;">
<label for="cant"><strong>Cantidad:</strong></label>
<input type="number" id="cant" value="1" min="1" max="${producto.stock || 1}" style="width:60px; padding:5px; text-align:center;">
</div>
<button id="btn-agregar-detalle" class="boton" ${producto.stock === 0 ? 'disabled' : ''}>Agregar al Carrito</button>
</div>
`;

// OBTENER Y BUSCAR PROMOCIONES DE LA CATEGORÍA
function cargarPromocionesDeCategoria() {
const divPromos = document.getElementById("lista-promos-aplicables");
let promociones = [];
try {
promociones = JSON.parse(localStorage.getItem("promociones_kolosos")) || [];
} catch (e) {
promociones = [];
}
const catProd = String(producto.categoria || "").toLowerCase().trim();
const promocionesValidas = promociones.filter(p => {
if (!p || p.estado !== "Activo") return false;
const aplicaA = String(p.aplica || "").toLowerCase().trim();
return aplicaA.includes("todo") || aplicaA.includes(catProd) || (catProd && catProd.includes(aplicaA));
});

if (promocionesValidas.length === 0) {
divPromos.innerHTML = `<span style="font-size: 0.85rem; color: #64748b;">No hay promociones especiales activas para esta categoría.</span>`;
return;
}

divPromos.innerHTML = promocionesValidas.map(p => `
<div style="display: flex; align-items: center; justify-content: space-between; margin-top: 6px; background: #ffffff; padding: 6px 10px; border-radius: 4px; border: 1px solid #e2e8f0;">
<span style="font-size: 0.85rem; color: #0f172a;"><strong>${p.descuento}</strong> (${p.aplica})</span>
<span style="background: #e0f2fe; color: #0369a1; padding: 2px 8px; border-radius: 4px; font-weight: bold; font-size: 0.8rem;">Código: ${p.codigo}</span>
</div>
`).join("");
}

cargarPromocionesDeCategoria();

// AGREGAR CON CANTIDAD
document.getElementById("btn-agregar-detalle").addEventListener("click", () => {
const cantidad = parseInt(document.getElementById("cant").value) || 1;
let carrito = JSON.parse(localStorage.getItem("carrito_kolosos")) || [];
const itemExistente = carrito.find(item => item.id === producto.id);
if (itemExistente) {
itemExistente.cantidad += cantidad;
} else {
carrito.push({...producto, cantidad });
}
localStorage.setItem("carrito_kolosos", JSON.stringify(carrito));
toast.textContent = "Producto agregado con éxito";
toast.classList.remove("oculto");
setTimeout(() => toast.classList.add("oculto"), 2500);
});

// MOSTRAR SUGERENCIAS PARECIDAS (Misma categoría)
const relacionados = productos.filter(p => p.categoria === producto.categoria && p.id !== producto.id).slice(0, 3);
relacionados.forEach(rel => {
const item = document.createElement("div");
item.style = "border:1px solid #ddd; padding:10px; border-radius:5px; background:white; text-align:center;";
item.innerHTML = `
<img src="${rel.imagen}" style="width:100%; height: 120px; object-fit:cover;" onerror="this.src='https://via.placeholder.com/150'">
<h4 style="font-size: 14px; margin:8px 0;">${rel.nombre}</h4>
<p style="color:#d35400; font-weight:bold;">${rel.precio}</p>
<a href="detalle.html?id=${rel.id}" class="boton" style="font-size: 11px; padding:5px 10px; text-decoration:none; display:inline-block; margin-top:5px;">Ver Opción</a>
`;
contenedorRel.appendChild(item);
});
});
</script>
<script src="global.js"></script>
</body>
</html>
